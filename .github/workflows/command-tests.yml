name: Command tests

on:
  push:
    branches: [main]
    paths: ['command/**', '.github/workflows/command-tests.yml']
  pull_request:
    paths: ['command/**', '.github/workflows/command-tests.yml']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pollproof
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: pollproof_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pollproof"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, sodium, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: command/package-lock.json

      - name: Build the command-room web app
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pollproof_test
          DB_USERNAME: pollproof
          DB_PASSWORD: secret
        run: php artisan test
