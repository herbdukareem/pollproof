name: Agent app

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'shared/**', '.github/workflows/mobile-tests.yml']
  pull_request:
    paths: ['mobile/**', 'shared/**', '.github/workflows/mobile-tests.yml']
  # Build and publish the APK on demand (Actions → Agent app → Run workflow).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the app is built and tested on this release. Flutter 3.50 deprecated
          # package:flutter/material.dart; move to material_ui before raising this.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Tests (including the signing contract shared with the server)
        run: flutter test

  apk:
    needs: test
    runs-on: ubuntu-latest
    # Publishing the build to the "agent-app" release needs write access to the repository.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the app is built and tested on this release. Flutter 3.50 deprecated
          # package:flutter/material.dart; move to material_ui before raising this.
          flutter-version: 3.47.9
          cache: true
      # The app's own signing key, from the repository's secrets. Without it every build would be
      # signed with the runner's throwaway debug key and could never update the installed app.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "No signing key on pull requests: building with the debug key, not published."
              exit 0
            fi
            echo "::error::The ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets are missing. See 'Signing the agent app' in deploy/hostinger/README.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pollproof-agent.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pollproof-agent.jks" >> "$GITHUB_ENV"
      # The build number goes up every run, so a new APK installs over the old one.
      - env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=API_URL=${{ vars.POLLPROOF_API_URL || 'https://app.pollproof.online' }}
      - uses: actions/upload-artifact@v4
        with:
          name: pollproof-agent-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      # The command room's "Agent app" button downloads from here (the server keeps a copy).
      - name: Publish to the agent-app release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk pollproof-agent.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          SHA=$(sha256sum pollproof-agent.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s pollproof-agent.apk)
          printf '{"version":"%s","build":%s,"built_at":"%s","size":%s,"sha256":"%s","commit":"%s"}\n' \
            "$VERSION" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIZE" "$SHA" "${GITHUB_SHA::7}" > version.json
          cat version.json
          gh release view agent-app >/dev/null 2>&1 || gh release create agent-app --target "$GITHUB_SHA" --latest=false \
            --title "PollProof agent app" --notes "Latest Android build of the agent app. Replaced on every build."
          gh release upload agent-app pollproof-agent.apk version.json --clobber
          gh release edit agent-app --notes "Latest Android build of the agent app: version $VERSION, build ${{ github.run_number }}, commit ${GITHUB_SHA::7}. Replaced on every build. Server: https://app.pollproof.online"

