name: Deploy to Hostinger

# Builds the command room (composer + Vite) on GitHub, uploads it over SSH and switches the
# live site with deploy/hostinger/activate.sh. See deploy/hostinger/README.md for set-up.
on:
  workflow_dispatch:
    inputs:
      create_campaign:
        description: 'First install only: create the campaign and DG account (fill the fields below)'
        type: boolean
        default: false
      campaign_name:
        description: 'Campaign name'
        required: false
      campaign_state:
        description: 'State'
        required: false
      election_date:
        description: 'Election date (YYYY-MM-DD)'
        required: false
      dg_name:
        description: "DG's full name"
        required: false
      dg_email:
        description: "DG's email (signs in with a temporary password printed in this run's log)"
        required: false
  push:
    branches: [main]
    paths: ['command/**', 'deploy/hostinger/**', '.github/workflows/deploy-hostinger.yml']

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    # Pushes to main deploy only once the HOSTINGER_AUTO_DEPLOY variable is set to true.
    if: github.event_name == 'workflow_dispatch' || vars.HOSTINGER_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: command/package-lock.json

      - name: Build the release
        working-directory: command
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          npm ci
          npm run build
          rm -rf node_modules tests storage/logs/*.log .env
          mkdir -p .deploy
          cp ../deploy/hostinger/activate.sh ../deploy/hostinger/rollback.sh .deploy/

      - name: Settings for the server
        working-directory: command
        env:
          DOMAIN: ${{ vars.HOSTINGER_DOMAIN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SMS_DRIVER: ${{ vars.POLLPROOF_SMS_DRIVER }}
          SMS_NUMBER: ${{ vars.POLLPROOF_SMS_NUMBER }}
          SMS_WEBHOOK_TOKEN: ${{ secrets.POLLPROOF_SMS_WEBHOOK_TOKEN }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          TERMII_SENDER_ID: ${{ vars.TERMII_SENDER_ID }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          # Quote values so phpdotenv reads them back exactly: single quotes are literal; values
          # containing a single quote use double quotes with \, " and $ escaped.
          q() { case "$1" in *\'*) printf '"%s"' "$(printf '%s' "$1" | sed 's/["\\$]/\\&/g')" ;; *) printf "'%s'" "$1" ;; esac; }
          {
            echo "APP_NAME=PollProof"
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "APP_URL=https://$DOMAIN"
            echo "APP_TIMEZONE=UTC"
            echo "LOG_CHANNEL=daily"
            echo "LOG_LEVEL=warning"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=${DB_HOST:-localhost}"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=$(q "$DB_DATABASE")"
            echo "DB_USERNAME=$(q "$DB_USERNAME")"
            echo "DB_PASSWORD=$(q "$DB_PASSWORD")"
            echo "SESSION_DRIVER=database"
            echo "SESSION_SECURE_COOKIE=true"
            echo "SESSION_DOMAIN=$DOMAIN"
            echo "SANCTUM_STATEFUL_DOMAINS=$DOMAIN"
            echo "CACHE_STORE=database"
            echo "QUEUE_CONNECTION=database"
            echo "POLLPROOF_QUEUE_VIA_SCHEDULER=true"
            echo "POLLPROOF_SMS_DRIVER=${SMS_DRIVER:-log}"
            echo "POLLPROOF_SMS_NUMBER=$(q "$SMS_NUMBER")"
            echo "POLLPROOF_SMS_WEBHOOK_TOKEN=$(q "$SMS_WEBHOOK_TOKEN")"
            echo "TERMII_API_KEY=$(q "$TERMII_API_KEY")"
            echo "TERMII_SENDER_ID=$(q "${TERMII_SENDER_ID:-PollProof}")"
            echo "TERMII_CHANNEL=dnd"
            if [ -n "$MAIL_HOST" ]; then
              echo "MAIL_MAILER=smtp"
              echo "MAIL_HOST=$MAIL_HOST"
              echo "MAIL_PORT=465"
              echo "MAIL_SCHEME=smtps"
              echo "MAIL_USERNAME=$(q "$MAIL_USERNAME")"
              echo "MAIL_PASSWORD=$(q "$MAIL_PASSWORD")"
              echo "MAIL_FROM_ADDRESS=$(q "$MAIL_USERNAME")"
            else
              echo "MAIL_MAILER=log"
            fi
          } > .env.deploy

      - name: Package
        run: |
          REL="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "REL=$REL" >> "$GITHUB_ENV"
          tar czf "/tmp/$REL.tgz" -C command .

      - name: Connect to the server
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
          H_USER: ${{ secrets.HOSTINGER_USER }}
          DOMAIN: ${{ vars.HOSTINGER_DOMAIN }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          H_HOST=$(trim "$H_HOST"); H_PORT=$(trim "${H_PORT:-65002}"); H_USER=$(trim "$H_USER"); DOMAIN=$(trim "$DOMAIN")
          missing=""
          [ -n "$H_HOST" ] || missing="$missing secret:HOSTINGER_HOST"
          [ -n "$H_USER" ] || missing="$missing secret:HOSTINGER_USER"
          [ -n "$KEY" ] || missing="$missing secret:HOSTINGER_SSH_KEY"
          [ -n "$DOMAIN" ] || missing="$missing variable:HOSTINGER_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::error::Not set (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy > ~/.ssh/deploy.pub 2> /tmp/keyerr; then
            if grep -qi passphrase /tmp/keyerr; then
              echo "::error::HOSTINGER_SSH_KEY is protected by a passphrase, so GitHub can't use it. Make a new key with an empty passphrase (see deploy/hostinger/README.md), add its .pub in hPanel and replace the secret."
            else
              echo "::error::HOSTINGER_SSH_KEY isn't a usable private key ($(head -1 /tmp/keyerr)). Paste the whole pollproof_deploy file (not the .pub), from the -----BEGIN line to the -----END line."
            fi
            exit 1
          fi
          echo "::notice::Deploy key: $(cut -d' ' -f1,2 ~/.ssh/deploy.pub | cut -c1-40)… fingerprint $(ssh-keygen -lf ~/.ssh/deploy.pub | cut -d' ' -f2). The same key must be listed in hPanel → Advanced → SSH Access → SSH keys."

          if [ -n "$(trim "$KNOWN")" ]; then
            printf '%s\n' "$KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 20 -p "$H_PORT" "$H_HOST" 2>/dev/null > ~/.ssh/known_hosts || true
            if [ -s ~/.ssh/known_hosts ]; then
              echo "::warning::HOSTINGER_KNOWN_HOSTS is not set; trusting the server key seen now. To pin it, save this as that secret: $(grep ed25519 ~/.ssh/known_hosts | head -1)"
            fi
          fi

          {
            echo "Host hostinger"
            echo "  HostName $H_HOST"
            echo "  Port $H_PORT"
            echo "  User $H_USER"
            echo "  IdentityFile $HOME/.ssh/deploy"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 25"
            echo "  StrictHostKeyChecking yes"
            echo "  ServerAliveInterval 30"
            echo "  LogLevel ERROR"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Retry a little: some servers briefly refuse connections right after ssh-keyscan.
          ok=""
          for attempt in 1 2 3; do
            if out=$(ssh -F ~/.ssh/config hostinger 'echo connected; echo "home=$HOME"; php -r "echo PHP_VERSION;" 2>&1 || true' 2> /tmp/ssherr); then ok=1; break; fi
            grep -qiE 'Permission denied|Host key verification|IDENTIFICATION|Could not resolve' /tmp/ssherr && break
            sleep $((attempt * 5))
          done
          if [ -z "$ok" ]; then
            err=$(tr '\n' ' ' < /tmp/ssherr)
            case "$err" in
              *"Permission denied"*) why="the server refused the key. Add the public key (pollproof_deploy.pub) in hPanel → Advanced → SSH Access → SSH keys, check HOSTINGER_USER is the SSH username shown there ($H_USER now), and that SSH access is enabled." ;;
              *"Host key verification failed"*|*"REMOTE HOST IDENTIFICATION"*) why="the server's key doesn't match HOSTINGER_KNOWN_HOSTS. Run ssh-keyscan -p $H_PORT $H_HOST again and replace that secret." ;;
              *"timed out"*|*"Connection refused"*|*"No route"*|*"Connection reset"*|*"Connection closed"*) why="nothing answered at $H_HOST port $H_PORT. Check the IP and port in hPanel → SSH Access, and that SSH access is enabled." ;;
              *"Could not resolve"*) why="$H_HOST isn't a valid address. Use the SSH IP from hPanel → SSH Access." ;;
              *) why="$err" ;;
            esac
            echo "::error::Couldn't sign in to $H_USER@$H_HOST:$H_PORT over SSH: $why"
            echo "ssh said: $err"
            exit 1
          fi
          echo "$out"
          home=$(printf '%s\n' "$out" | sed -n 's/^home=//p')
          echo "::notice::Connected to $H_USER@$H_HOST:$H_PORT (PHP $(printf '%s\n' "$out" | tail -1))."

          base="${home:-/home/$H_USER}/domains/$DOMAIN"
          if ! ssh -F ~/.ssh/config hostinger "test -d '$base'"; then
            echo "::error::$base doesn't exist on the server. Set HOSTINGER_DOMAIN to the website's name exactly as hPanel lists it under Websites (e.g. lightseagreen-trout-569131.hostingersite.com)."
            exit 1
          fi
          {
            echo "APP_DIR=$base/pollproof"
            echo "WEB_DIR=$base/public_html"
            echo "SSH=ssh -F $HOME/.ssh/config hostinger"
            echo "SCP=scp -F $HOME/.ssh/config"
          } >> "$GITHUB_ENV"

      - name: Upload
        run: |
          $SSH "mkdir -p '$APP_DIR/releases/$REL'"
          $SCP "/tmp/$REL.tgz" "hostinger:$APP_DIR/releases/$REL.tgz"
          $SSH "cd '$APP_DIR/releases' && tar xzf '$REL.tgz' -C '$REL' && rm '$REL.tgz'"

      - name: Go live
        run: $SSH "PHP_BIN=${{ vars.HOSTINGER_PHP_BIN || 'php' }} PUBLIC_MODE=${{ vars.HOSTINGER_PUBLIC_MODE || 'symlink' }} bash '$APP_DIR/releases/$REL/.deploy/activate.sh' '$APP_DIR' '$REL' '$WEB_DIR'"

      - name: Create the campaign and DG
        if: github.event_name == 'workflow_dispatch' && inputs.create_campaign
        env:
          C_NAME: ${{ inputs.campaign_name }}
          C_STATE: ${{ inputs.campaign_state }}
          C_DATE: ${{ inputs.election_date }}
          C_DG_NAME: ${{ inputs.dg_name }}
          C_DG_EMAIL: ${{ inputs.dg_email }}
        run: |
          args=$(printf ' %q' --no-interaction "--name=$C_NAME" "--state=$C_STATE" "--election-date=$C_DATE" "--dg-name=$C_DG_NAME" "--dg-email=$C_DG_EMAIL")
          $SSH "cd '$APP_DIR/current' && ${{ vars.HOSTINGER_PHP_BIN || 'php' }} artisan pollproof:create-campaign$args"

      - name: Check the site answers
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.HOSTINGER_DOMAIN }}/up" || true)
            [ "$code" = "200" ] && { echo "https://${{ vars.HOSTINGER_DOMAIN }} is up"; exit 0; }
            sleep 5
          done
          echo "::error::https://${{ vars.HOSTINGER_DOMAIN }}/up answered $code. Check storage/logs on the server, or roll back with .deploy/rollback.sh."
          exit 1
